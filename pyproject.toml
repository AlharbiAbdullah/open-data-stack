[project]
name = "open-data-stack"
version = "0.1.0"
description = "Open source data stack showcasing batch and streaming pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data ingestion
    "yfinance>=0.2.40",

    # Data processing
    "pandas>=2.2.0",
    "polars>=1.0.0",

    # Data warehouse
    "duckdb>=1.0.0",

    # Kafka
    "confluent-kafka>=2.5.0",

    # Pydantic for data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0",
]
airflow = [
    "apache-airflow>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "ipdb>=0.13.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_data_stack"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["open_data_stack"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "confluent_kafka.*",
    "pyspark.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
